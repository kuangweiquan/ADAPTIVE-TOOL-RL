# Ablation: With format gate but no asymmetric fusion
# R = R_format · (acc + λ·U − γ·C + η·S)
name: atr_format_gate
reward: adaptive_tool

model: Qwen2.5-VL-7B-Instruct
lora_rank: 16
rl_steps: 200
batch_size: 128
learning_rate: 1e-6

datasets:
  - VStar: 191
  - HRBench-4K: 2000
  - VSI-Bench: 3000

lambda_u: 1.0
gamma_c: 0.5
eta_s: 0.3

enable_question_aware_utility: true
enable_lazy_crop_penalty: true

# Format gate ON, asymmetric OFF
enable_format_gate: true
format_gate_strict: false
enable_asymmetric_fusion: false
